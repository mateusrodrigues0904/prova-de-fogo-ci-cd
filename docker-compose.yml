# docker-compose.yml — facilita idição e execução local sem instalar Python.
# `docker compose up --build` sobe a API na porta 8000 com reload ligado.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: prova-de-fogo-fastapi:local
    container_name: prova-de-fogo-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENVIRONMENT=development
      - APP_NAME=prova-de-fogo-fastapi
    # Healthcheck replicando o do Dockerfile (imagem slim não tem curl).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
